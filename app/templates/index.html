<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Crop Doctor - कृषी डॉक्टर</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="mobile-container">
    <!-- Header -->
    <header class="app-header">
        <div class="header-brand">
            <span class="logo-icon">🌿</span>
            <div>
                <h1 data-i18n="app_title">कृषी डॉक्टर</h1>
                <p data-i18n="app_subtitle">पिकांवरील रोग निदान व उपचार</p>
            </div>
        </div>

        <!-- Language Selector -->
        <div class="lang-selector">
            <button class="lang-btn active" data-lang="mr" onclick="setAppLanguage('mr')">मराठी</button>
            <button class="lang-btn" data-lang="hi" onclick="setAppLanguage('hi')">हिंदी</button>
            <button class="lang-btn" data-lang="en" onclick="setAppLanguage('en')">EN</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="app-content">
        <!-- Crop Selection Chips -->
        <div class="section-title">
            <span data-i18n="select_crop">पीक निवडा:</span>
        </div>
        <div class="crops-bar">
            <button class="crop-chip active" data-crop="Pomegranate" onclick="selectCrop('Pomegranate')">
                <span>🍎</span> <span data-i18n="crop_pom">डाळिंब</span>
            </button>
            <button class="crop-chip" data-crop="Onion" onclick="selectCrop('Onion')">
                <span>🧅</span> <span data-i18n="crop_onion">कांदा</span>
            </button>
            <button class="crop-chip" data-crop="Tomato" onclick="selectCrop('Tomato')">
                <span>🍅</span> <span data-i18n="crop_tomato">टोमॅटो</span>
            </button>
        </div>

        <!-- Voice Assistant Bar -->
        <div class="voice-bar">
            <div class="voice-status">
                <span>🎙️</span>
                <span id="voiceStatusText">माइक दाबून बोला (उदा. 'डाळिंब', 'कांदा')</span>
            </div>
            <button id="micBtn" class="mic-btn" onclick="VoiceAssistant.toggleListening()" title="Speak voice command">
                🎤
            </button>
        </div>

        <!-- Image Upload / Camera Box -->
        <div id="uploadArea" class="upload-card">
            <span class="upload-icon">📸</span>
            <h3 data-i18n="upload_heading">पानाचा फोटो काढा किंवा अपलोड करा</h3>
            <p data-i18n="upload_sub">चांगल्या प्रकाशात पानाचा स्पष्ट फोटो निवडा</p>

            <div class="upload-actions">
                <!-- Gallery File Picker -->
                <label for="fileInput" class="btn-upload">
                    <span>📁</span> <span data-i18n="btn_gallery">गॅलरी</span>
                </label>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">

                <!-- Camera Capture Button -->
                <button type="button" id="startCameraBtn" class="btn-upload btn-camera">
                    <span>📷</span> <span data-i18n="btn_camera">कॅमेरा</span>
                </button>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
            </div>
        </div>

        <!-- Live Camera Viewfinder Modal -->
        <div id="cameraModal" class="camera-modal" style="display: none;">
            <div class="camera-modal-content">
                <div class="camera-modal-header">
                    <span class="camera-modal-title">
                        <span>📷</span> <span data-i18n="camera_title">थेट कॅमेरा</span>
                    </span>
                    <div class="camera-header-actions">
                        <button id="switchCameraBtn" class="camera-icon-btn" title="कॅमेरा बदला (Switch Camera)" type="button" style="display: none;">🔄</button>
                        <button id="closeCameraBtn" class="camera-icon-btn camera-close-btn" title="बंद करा (Close)" type="button">✕</button>
                    </div>
                </div>

                <div class="camera-viewport">
                    <video id="cameraVideo" autoplay playsinline muted></video>
                    <div class="camera-overlay">
                        <div class="viewfinder-box">
                            <span class="viewfinder-corner top-left"></span>
                            <span class="viewfinder-corner top-right"></span>
                            <span class="viewfinder-corner bottom-left"></span>
                            <span class="viewfinder-corner bottom-right"></span>
                            <p class="viewfinder-hint" data-i18n="camera_guide">पानावर कॅमेरा स्थिर ठेवा</p>
                        </div>
                    </div>
                </div>

                <div class="camera-modal-footer">
                    <button id="capturePhotoBtn" class="btn-shutter" type="button" title="फोटो काढा (Capture Photo)">
                        <span class="shutter-inner"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Image Preview Card -->
        <div id="previewContainer" class="preview-container">
            <img id="previewImg" class="preview-img" alt="Leaf Preview">
            <div class="preview-overlay">
                <span style="color: white; font-size: 13px; font-weight: 600;">निवडलेला फोटो</span>
                <button class="btn-reupload" onclick="resetUpload()" data-i18n="btn_change">फोटो बदला</button>
            </div>
        </div>

        <!-- Hidden input storing raw class for language re-toggle -->
        <input type="hidden" id="detectedClassRaw">

        <!-- Analyze Button -->
        <button id="analyzeBtn" class="btn-analyze" disabled>
            <span id="spinner" class="spinner"></span>
            <span id="btnText" data-i18n="btn_analyze">रोग तपासा</span>
        </button>

        <!-- Prediction Result Container -->
        <div id="resultContainer" class="result-container">
            <div id="resultContent"></div>
        </div>
    </main>

    <!-- Bottom Mobile Navigation -->
    <nav class="bottom-nav">
        <a href="/" class="nav-item active">
            <span class="icon">🔍</span>
            <span data-i18n="nav_home">स्कॅन</span>
        </a>
        <a href="/history" class="nav-item">
            <span class="icon">📜</span>
            <span data-i18n="nav_history">इतिहास</span>
        </a>
        <a href="/admin" class="nav-item">
            <span class="icon">📊</span>
            <span data-i18n="nav_admin">अॅडमिन</span>
        </a>
    </nav>
</div>

<script src="/static/js/voice.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
