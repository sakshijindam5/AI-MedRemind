<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scan History - तपासणी इतिहास</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .history-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .history-card {
            display: flex;
            gap: 12px;
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            box-shadow: var(--shadow-sm);
            align-items: center;
        }
        .history-thumb {
            width: 70px;
            height: 70px;
            border-radius: 12px;
            object-fit: cover;
            background: #f1f5f9;
        }
        .history-info {
            flex: 1;
        }
        .history-info h4 {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 2px;
        }
        .history-info .date {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 10px;
        }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

<div class="mobile-container">
    <header class="app-header">
        <div class="header-brand">
            <a href="/" style="color: white; text-decoration: none; font-size: 20px; margin-right: 6px;">←</a>
            <div>
                <h1>तपासणी इतिहास</h1>
                <p>मागील सर्व स्कॅन केलेल्या पानांची यादी</p>
            </div>
        </div>
        <div class="lang-selector">
            <button class="lang-btn active" onclick="loadHistory('mr')">मराठी</button>
            <button class="lang-btn" onclick="loadHistory('hi')">हिंदी</button>
            <button class="lang-btn" onclick="loadHistory('en')">EN</button>
        </div>
    </header>

    <main class="app-content">
        <div id="historyList" class="history-list">
            <p style="text-align: center; color: var(--text-muted); padding: 30px;">इतिहास लोड होत आहे...</p>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <span class="icon">🔍</span>
            <span>स्कॅन</span>
        </a>
        <a href="/history" class="nav-item active">
            <span class="icon">📜</span>
            <span>इतिहास</span>
        </a>
        <a href="/admin" class="nav-item">
            <span class="icon">📊</span>
            <span>अॅडमिन</span>
        </a>
    </nav>
</div>

<script>
let currentLang = 'mr';

async function loadHistory(lang = 'mr') {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => {
        b.classList.toggle('active', b.textContent.toLowerCase().includes(lang === 'mr' ? 'मराठी' : lang === 'hi' ? 'हिंदी' : 'en'));
    });

    try {
        const res = await fetch(`/api/history?lang=${lang}`);
        const data = await res.json();
        const listEl = document.getElementById('historyList');

        if (!data || data.length === 0) {
            listEl.innerHTML = `<p style="text-align:center; color:var(--text-muted); padding:40px;">अद्याप कोणताही स्कॅन उपलब्ध नाही.</p>`;
            return;
        }

        listEl.innerHTML = data.map(item => `
            <div class="history-card">
                <img src="${item.image_url}" class="history-thumb" alt="${item.disease_name}">
                <div class="history-info">
                    <span class="badge ${item.is_low_confidence ? 'badge-warning' : 'badge-success'}">
                        ${item.crop_detected} (${item.confidence_percentage})
                    </span>
                    <h4>${item.disease_name}</h4>
                    <div class="date">${item.scanned_at}</div>
                </div>
            </div>
        `).join('');

    } catch (e) {
        console.error(e);
        document.getElementById('historyList').innerHTML = `<p style="color:red; text-align:center;">डेटा लोड करण्यात त्रुटी आली.</p>`;
    }
}

document.addEventListener('DOMContentLoaded', () => loadHistory('mr'));
</script>

</body>
</html>
