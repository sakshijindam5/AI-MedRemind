<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin & Analytics Dashboard - Crop Doctor</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            box-shadow: var(--shadow-sm);
        }
        .stat-card .num {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 2px;
        }
        .stat-card .desc {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .chart-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }
        .chart-card h3 {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }
        .bar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .bar-name {
            width: 140px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .bar-fill-wrap {
            flex: 1;
            background: #f1f5f9;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 5px;
        }
        .bar-val {
            width: 30px;
            text-align: right;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <header class="app-header">
        <div class="header-brand">
            <a href="/" style="color: white; text-decoration: none; font-size: 20px; margin-right: 6px;">←</a>
            <div>
                <h1>Admin Analytics</h1>
                <p>Scans, Crop Distribution & Diseases</p>
            </div>
        </div>
    </header>

    <main class="app-content">
        <!-- High Level Stats -->
        <div class="stats-grid">
            <div class="stat-card">
                <div id="statTotalScans" class="num">0</div>
                <div class="desc">Total Leaf Scans</div>
            </div>
            <div class="stat-card">
                <div id="statLowConf" class="num" style="color: #d97706;">0</div>
                <div class="desc">Low Conf (< 70%)</div>
            </div>
        </div>

        <!-- Scans By Crop -->
        <div class="chart-card">
            <h3>🌾 Scans By Crop</h3>
            <div id="cropBars"></div>
        </div>

        <!-- Top Detected Diseases -->
        <div class="chart-card">
            <h3>🦠 Most Detected Diseases</h3>
            <div id="diseaseBars"></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="/" class="nav-item">
            <span class="icon">🔍</span>
            <span>स्कॅन</span>
        </a>
        <a href="/history" class="nav-item">
            <span class="icon">📜</span>
            <span>इतिहास</span>
        </a>
        <a href="/admin" class="nav-item active">
            <span class="icon">📊</span>
            <span>अॅडमिन</span>
        </a>
    </nav>
</div>

<script>
async function loadAnalytics() {
    try {
        const res = await fetch('/api/analytics');
        const data = await res.json();

        document.getElementById('statTotalScans').textContent = data.total_scans;
        document.getElementById('statLowConf').textContent = data.low_confidence_scans;

        // Crop distribution bars
        const cropBarsEl = document.getElementById('cropBars');
        const cropEntries = Object.entries(data.scans_by_crop);
        const maxCrop = Math.max(...cropEntries.map(e => e[1]), 1);

        if (cropEntries.length === 0) {
            cropBarsEl.innerHTML = `<p style="font-size:12px; color:var(--text-muted);">No scan data recorded yet.</p>`;
        } else {
            cropBarsEl.innerHTML = cropEntries.map(([crop, count]) => `
                <div class="bar-item">
                    <span class="bar-name">${crop}</span>
                    <div class="bar-fill-wrap">
                        <div class="bar-fill" style="width: ${(count / maxCrop) * 100}%"></div>
                    </div>
                    <span class="bar-val">${count}</span>
                </div>
            `).join('');
        }

        // Top Diseases bars
        const diseaseBarsEl = document.getElementById('diseaseBars');
        const maxDisease = Math.max(...data.most_detected_diseases.map(d => d.count), 1);

        if (data.most_detected_diseases.length === 0) {
            diseaseBarsEl.innerHTML = `<p style="font-size:12px; color:var(--text-muted);">No diseases detected yet.</p>`;
        } else {
            diseaseBarsEl.innerHTML = data.most_detected_diseases.map(item => `
                <div class="bar-item">
                    <span class="bar-name" title="${item.disease}">${item.disease.replace(/___/g, ' ')}</span>
                    <div class="bar-fill-wrap">
                        <div class="bar-fill" style="width: ${(item.count / maxDisease) * 100}%; background: #0284c7;"></div>
                    </div>
                    <span class="bar-val">${item.count}</span>
                </div>
            `).join('');
        }

    } catch (e) {
        console.error(e);
    }
}

document.addEventListener('DOMContentLoaded', loadAnalytics);
</script>

</body>
</html>
